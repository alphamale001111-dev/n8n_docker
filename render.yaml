services:
  - type: web
    name: n8n-pandoc
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    startCommand: n8n start --port=$PORT --host=0.0.0.0

    envVars:
      - key: PORT
        value: 10000   # Render usually prefers 10000

      - key: WEBHOOK_URL
        value: https://your-app-name.onrender.com

      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"

      - key: N8N_BASIC_AUTH_USER
        value: admin

      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false