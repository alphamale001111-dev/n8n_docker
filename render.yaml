services:
  - type: web
    name: n8n-pandoc
    runtime: docker

    dockerfilePath: ./Dockerfile

    envVars:
      - key: PORT
        value: 10000

      - key: WEBHOOK_URL
        value: https://your-app-name.onrender.com

      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"

      - key: N8N_BASIC_AUTH_USER
        value: admin

      - key: N8N_BASIC_AUTH_PASSWORD
        value: Asdf@123